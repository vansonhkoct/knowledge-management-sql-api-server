[build-system]
requires=["hatchling"]
build-backend="hatchling.build"

[project]
name="py-eschat-llm"
version="0.1.0"
description="ESChatLLM library for Elasticsearch-powered Chat with LLM agents"
readme="README.md"
requires-python=">=3.8"
license="MIT"
authors=[
    {name="Developer", email="dev@example.com"}
]
classifiers=[
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies=[
    "requests>=2.31.0",
    "opencc>=1.1.0",
    "pydantic>=1.10.0",
    "typing-extensions>=4.7.0",
    "elasticsearch>=8.12.0,<9.0.0",
    "sentence-transformers>=2.5.0",
    "langchain>=0.1.0",
    "langchain-community>=0.1.0",
    "langchain-text-splitters>=1.0.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.7",
    "beautifulsoup4>=4.12.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev=[
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.urls]
Homepage="https://github.com/example/py-eschat-llm"
Repository="https://github.com/example/py-eschat-llm"
Documentation="https://github.com/example/py-eschat-llm/blob/main/README.md"